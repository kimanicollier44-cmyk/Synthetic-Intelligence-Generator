version: "3.9"

services:

  synthetic-ai:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    container_name: synthetic-ai

    ports:
      - "8000:8000"

    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}

    volumes:
      - ../data:/app/data
      - ../outputs:/app/outputs

    restart: unless-stopped
    
